name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 como el de desarrollo. Con 20 no alcanza: los scripts de
      # test pasan globs ("test/unidad/*.test.mjs") y expandirlos dentro
      # de node --test recién existe desde la 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npm test
