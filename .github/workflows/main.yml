name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 como el de desarrollo. Con 20 no alcanza: los scripts de
      # test pasan globs ("test/unidad/*.test.mjs") y expandirlos dentro
      # de node --test recién existe desde la 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm ci en vez de npm install: instala exactamente las versiones
      # del package-lock.json, asi que el CI corre siempre contra lo
      # mismo y nadie puede colar una version nueva sin que se vea en el
      # diff del lock.
      #
      # --ignore-scripts corta los hooks de instalacion (preinstall,
      # postinstall). Son codigo arbitrario de terceros y aca no hacen
      # falta: ninguna dependencia del proyecto necesita compilar nada.
      - run: npm ci --ignore-scripts

      - run: npm test
